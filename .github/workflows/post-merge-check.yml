name: Post Merge Check

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  post-merge-check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and run unit tests
        run: ./gradlew build

      - name: Run custom full-repository check
        run: |
          python3 scripts/custom_check.py \
            --mode full \
            --output full-repo-check-report.json

      - name: Generate annotations and summary
        run: |
          python3 scripts/emit_annotations.py \
            --input full-repo-check-report.json \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --fail-on-error

      - name: Upload full repository report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-repo-check-report
          path: full-repo-check-report.json
