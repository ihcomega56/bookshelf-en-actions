name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

jobs:
  pr-check:
    if: github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and run unit tests
        run: ./gradlew build

      - name: Collect changed files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

      - name: Run custom diff check
        run: |
          python3 scripts/custom_check.py \
            --mode diff \
            --changed-files-file changed-files.txt \
            --output custom-check-report.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI check dependencies
        run: pip install -r scripts/requirements-ai-check.txt

      - name: Log in to Azure (OIDC)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run AI review check
        env:
          AZURE_AI_FOUNDRY_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_FOUNDRY_PROJECT_ENDPOINT }}
          AZURE_AI_FOUNDRY_AGENT_ID: ${{ vars.AZURE_AI_FOUNDRY_AGENT_ID }}
          AZURE_AI_FOUNDRY_API_KEY: ${{ secrets.AZURE_AI_FOUNDRY_API_KEY }}
        run: |
          python3 scripts/ai_review_check.py \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --output ai-review-report.json \
            --raw-output ai-review-raw.md

      - name: Publish annotations
        run: |
          python3 scripts/emit_annotations.py \
            --input custom-check-report.json \
            --input ai-review-report.json \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --pr-comment-file pr-comment.md \
            --ai-raw-file ai-review-raw.md \
            --fail-on-error

      - name: Post PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f pr-comment.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --body-file pr-comment.md
          else
            echo "pr-comment.md not found (an earlier step likely failed); skipping PR comment."
          fi

      - name: Upload custom check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-custom-check-report
          path: custom-check-report.json

      - name: Upload AI review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-ai-review-report
          path: |
            ai-review-report.json
            ai-review-raw.md
            pr-comment.md
