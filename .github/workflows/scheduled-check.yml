name: Scheduled Check

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  scheduled-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dependency check (configured task or fallback)
        run: |
          if ./gradlew tasks --all | grep -q "dependencyUpdates"; then
            ./gradlew dependencyUpdates
          else
            echo "dependencyUpdates task is not configured in this project." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "To enable outdated dependency reporting, configure a dependency update task and run it here." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            ./gradlew dependencies > dependency-report.txt
            echo "Saved current dependency tree to dependency-report.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run custom full-repository check
        run: |
          python3 scripts/custom_check.py \
            --mode full \
            --output scheduled-full-repo-check-report.json

      - name: Generate annotations and summary
        run: |
          python3 scripts/emit_annotations.py \
            --input scheduled-full-repo-check-report.json \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --fail-on-error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-check-artifacts
          path: |
            scheduled-full-repo-check-report.json
            dependency-report.txt
